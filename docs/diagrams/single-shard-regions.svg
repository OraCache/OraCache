<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img" aria-labelledby="title desc">
  <title id="title">OraCache master-master: один шард в двух регионах</title>
  <desc id="desc">В каждом регионе отдельная Raft-группа S1 с лидером и двумя followers. Оба лидера принимают локальные записи и импортируют изменения друг друга. Между регионами двусторонний поток событий. Внешний control plane управляет конфигурацией и размещением и получает статусы data plane.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52627a; }
      .heading { font-size: 22px; font-weight: 700; }
      .machine { font-size: 20px; font-weight: 600; text-anchor: middle; }
      .role { font-size: 20px; font-weight: 600; text-anchor: middle; }
      .white { fill: #ffffff; }
      .cp-note { font-size: 17px; fill: #e2e8f0; text-anchor: middle; }
      .center { text-anchor: middle; }
    </style>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <g id="machine-box"><rect width="236" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/></g>
  </defs>
  <rect width="1120" height="940" fill="#ffffff"/>
  <text x="24" y="42" class="title">Master-master · один шард</text>
  <text x="24" y="74" class="subtitle">Две независимые Raft-группы. Оба региона принимают локальные GET / PUT / Invalidate.</text>
  <rect x="208" y="96" width="704" height="80" rx="10" fill="#172b4d"/>
  <text x="560" y="128" class="heading white center">Внешний CONTROL PLANE</text>
  <text x="560" y="155" class="cp-note">Чёрный ящик · внутренняя реализация вне нашей части</text>
  <path d="M240 176 V258" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#control-arrow)"/>
  <text x="262" y="208" class="subtitle">Конфигурация, placement,</text>
  <text x="262" y="234" class="subtitle">адреса peers и команды</text>
  <path d="M880 260 V178" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#control-arrow)"/>
  <text x="596" y="208" class="subtitle">Статусы групп, readiness,</text>
  <text x="596" y="234" class="subtitle">лидеры и replication lag</text>
  <rect x="8" y="260" width="1104" height="660" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="24" y="290" class="heading">Наш DATA PLANE</text>
  <rect x="24" y="312" width="1072" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="344" class="heading">Регион A · группа A/S1</text>
  <text x="720" y="344" class="subtitle">Локальный кворум: 2 из 3</text>
  <g transform="translate(48 374)">
    <use href="#machine-box"/><text x="118" y="30" class="machine">Машина A2</text>
    <rect x="16" y="52" width="204" height="46" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="118" y="82" class="role">S1 · follower</text>
  </g>
  <g transform="translate(442 374)">
    <use href="#machine-box"/><text x="118" y="30" class="machine">Машина A1</text>
    <rect x="16" y="52" width="204" height="46" rx="6" fill="#1d4ed8"/>
    <text x="118" y="82" class="role white">S1 · LEADER</text>
  </g>
  <g transform="translate(836 374)">
    <use href="#machine-box"/><text x="118" y="30" class="machine">Машина A3</text>
    <rect x="16" y="52" width="204" height="46" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="118" y="82" class="role">S1 · follower</text>
  </g>
  <path d="M440 448 H286" stroke="#2563eb" stroke-width="2" marker-start="url(#data-arrow)" marker-end="url(#data-arrow)"/>
  <text x="363" y="430" class="subtitle center">Raft</text>
  <path d="M680 448 H834" stroke="#2563eb" stroke-width="2" marker-start="url(#data-arrow)" marker-end="url(#data-arrow)"/>
  <text x="757" y="430" class="subtitle center">Raft</text>
  <path d="M560 528 V628" stroke="#2563eb" stroke-width="3" marker-start="url(#data-arrow)" marker-end="url(#data-arrow)"/>
  <text x="586" y="568" class="heading">События A ↔ B</text>
  <text x="586" y="598" class="subtitle">ACK · повторная доставка</text>
  <text x="48" y="570" class="subtitle">Export committed-событий</text>
  <text x="48" y="600" class="subtitle">Import через локальный Raft</text>
  <rect x="24" y="636" width="1072" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="668" class="heading">Регион B · группа B/S1</text>
  <text x="720" y="668" class="subtitle">Локальный кворум: 2 из 3</text>
  <g transform="translate(48 698)">
    <use href="#machine-box"/><text x="118" y="30" class="machine">Машина B2</text>
    <rect x="16" y="52" width="204" height="46" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="118" y="82" class="role">S1 · follower</text>
  </g>
  <g transform="translate(442 698)">
    <use href="#machine-box"/><text x="118" y="30" class="machine">Машина B1</text>
    <rect x="16" y="52" width="204" height="46" rx="6" fill="#1d4ed8"/>
    <text x="118" y="82" class="role white">S1 · LEADER</text>
  </g>
  <g transform="translate(836 698)">
    <use href="#machine-box"/><text x="118" y="30" class="machine">Машина B3</text>
    <rect x="16" y="52" width="204" height="46" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="118" y="82" class="role">S1 · follower</text>
  </g>
  <path d="M440 772 H286" stroke="#2563eb" stroke-width="2" marker-start="url(#data-arrow)" marker-end="url(#data-arrow)"/>
  <text x="363" y="754" class="subtitle center">Raft</text>
  <path d="M680 772 H834" stroke="#2563eb" stroke-width="2" marker-start="url(#data-arrow)" marker-end="url(#data-arrow)"/>
  <text x="757" y="754" class="subtitle center">Raft</text>
  <text x="24" y="878" class="subtitle">Лидер выбирается отдельно в каждой группе. Общего межрегионального Raft-кворума нет.</text>
  <text x="24" y="905" class="subtitle">Пунктир: управление и статусы. Сплошные стрелки: Raft и межрегиональная доставка данных.</text>
</svg>
