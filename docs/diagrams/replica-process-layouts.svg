<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
  <title id="title">Два варианта запуска реплик шардов на одной машине</title>
  <desc id="desc">Слева P1: один процесс содержит реплики S1, S2, S3. Справа P2: каждая из тех же реплик работает в отдельном процессе. Это альтернативные способы запуска на условной машине X, а не разные регионы. Control plane показан внешним чёрным ящиком. В обоих вариантах роли leader и follower меняются через Raft.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52627a; }
      .heading { font-size: 22px; font-weight: 700; }
      .process { font-size: 19px; font-weight: 600; }
      .replica { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .white { fill: #ffffff; }
      .center { text-anchor: middle; }
      .cp-note { font-size: 17px; fill: #e2e8f0; text-anchor: middle; }
    </style>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="900" fill="#ffffff"/>
  <text x="24" y="42" class="title">Размещение реплик по процессам</text>
  <text x="24" y="74" class="subtitle">Одна машина, те же три реплики — два альтернативных способа запуска.</text>
  <rect x="208" y="96" width="704" height="80" rx="10" fill="#172b4d"/>
  <text x="560" y="128" class="heading white center">Внешний CONTROL PLANE</text>
  <text x="560" y="155" class="cp-note">Чёрный ящик · запуск процессов выполняет внешняя система</text>
  <path d="M240 176 V258" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#control-arrow)"/>
  <text x="262" y="208" class="subtitle">Конфигурация, размещение,</text>
  <text x="262" y="234" class="subtitle">команды управления</text>
  <path d="M880 260 V178" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#control-arrow)"/>
  <text x="596" y="208" class="subtitle">Статусы процессов и peers,</text>
  <text x="596" y="234" class="subtitle">readiness каждой реплики</text>
  <rect x="8" y="260" width="1104" height="620" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="48" y="300" class="heading">P1 · общий процесс</text>
  <text x="600" y="300" class="heading">P2 · процесс на реплику</text>

  <rect x="24" y="326" width="520" height="450" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="358" class="heading">Машина X</text>
  <rect x="48" y="384" width="472" height="358" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="72" y="420" class="process">Процесс OraCache</text>
  <rect x="72" y="448" width="424" height="64" rx="6" fill="#1d4ed8"/>
  <text x="284" y="488" class="replica white">S1 · leader</text>
  <rect x="72" y="538" width="424" height="64" rx="6" fill="#ffedd5" stroke="#fb923c"/>
  <text x="284" y="578" class="replica">S2 · follower</text>
  <rect x="72" y="628" width="424" height="64" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="284" y="668" class="replica">S3 · follower</text>
  <text x="72" y="723" class="subtitle">Один runtime обслуживает три группы</text>

  <rect x="576" y="326" width="520" height="450" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="358" class="heading">Та же машина X</text>
  <rect x="600" y="384" width="472" height="108" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="624" y="416" class="process">Процесс OraCache · peer S1</text>
  <rect x="624" y="430" width="424" height="46" rx="6" fill="#1d4ed8"/>
  <text x="836" y="460" class="replica white">S1 · leader</text>
  <rect x="600" y="506" width="472" height="108" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="624" y="538" class="process">Процесс OraCache · peer S2</text>
  <rect x="624" y="552" width="424" height="46" rx="6" fill="#ffedd5" stroke="#fb923c"/>
  <text x="836" y="582" class="replica">S2 · follower</text>
  <rect x="600" y="628" width="472" height="108" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="624" y="660" class="process">Процесс OraCache · peer S3</text>
  <rect x="624" y="674" width="424" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="836" y="704" class="replica">S3 · follower</text>

  <text x="24" y="812" class="subtitle">Другие участники этих групп размещены на других машинах; здесь показана только машина X.</text>
  <text x="24" y="839" class="subtitle">Число реплик, кворумы и master-master одинаковы. Роль leader / follower меняется через Raft.</text>
  <text x="24" y="866" class="subtitle">Падение процесса затрагивает его реплики; падение машины — все её процессы в обоих вариантах.</text>
</svg>
