<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
<title id="title">OraCache: пример топологии двух регионов</title>
<desc id="desc">В каждом регионе два Gateway, два CP Service, три Metadata Store и четыре storage-машины с девятью peers трёх шардов. A — primary всех шардов. GET обслуживается локально, PUT из B пересылается Gateway A. Raft-хранилище A фиксирует cache и outbox атомарно и отправляет события в региональную копию B. CP получает peer-статусы через Agent и публикует маршруты. External Supervisor запускает процессы.</desc>
