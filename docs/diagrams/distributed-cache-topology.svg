<text x="640" y="996" font-size="17" fill="#52627a" font-weight="400" text-anchor="middle">CP задаёт назначения → Supervisor запускает процессы → CP Agent регистрирует узлы и peers</text>
<text x="24" y="1038" font-size="18" fill="#172b4d" font-weight="400" text-anchor="start">① Обычный GET не обращается к CP. Gateway заранее знает шард, peers, readiness и leader hint.</text>
<text x="24" y="1067" font-size="18" fill="#172b4d" font-weight="400" text-anchor="start">② PUT проверяет primary policy. ③ Cache + outbox фиксируются атомарно; Sender идёт прямо в Receiver.</text>
<text x="24" y="1096" font-size="18" fill="#172b4d" font-weight="400" text-anchor="start">Пунктир: конфигурация и отчёты CP Agent. CP A ↔ CP B обмениваются каталогами регионов и endpoints.</text>
<text x="24" y="1125" font-size="18" fill="#172b4d" font-weight="400" text-anchor="start">L/F — роли локальных групп. B-лидеры не принимают исходные PUT. На регион: 11 инстансов + внешний LB.</text>
