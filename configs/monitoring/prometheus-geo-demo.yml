global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - raft-rules.yml

scrape_configs:
  - job_name: cp-api
    static_configs:
      - targets: ["cp-api:9464"]
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9466"]
        labels: {region: region-a}
      - targets: ["api-gateway-b:9466"]
        labels: {region: region-b}
  - job_name: storage-node
    metrics_path: /metrics
    follow_redirects: false
    http_sd_configs:
      - url: http://cp-api:9464/discovery/storage-nodes?region=region-a
        refresh_interval: 2s
      - url: http://cp-api:9464/discovery/storage-nodes?region=region-b
        refresh_interval: 2s
    metric_relabel_configs:
      - action: labeldrop
        regex: exported_(node_id|region)
