global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - raft-rules.yml

scrape_configs:
  - job_name: cp-api
    static_configs:
      - targets: ["cp-api:9464"]
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9466"]
        labels: {region: region-a}
      - targets: ["api-gateway-b:9466"]
        labels: {region: region-b}
  - job_name: storage-node
    honor_labels: true
    static_configs:
      - targets: ["a-1:28191"]
        labels: {region: region-a, node_id: a-1}
      - targets: ["a-2:28191"]
        labels: {region: region-a, node_id: a-2}
      - targets: ["a-3:28191"]
        labels: {region: region-a, node_id: a-3}
      - targets: ["b-1:28191"]
        labels: {region: region-b, node_id: b-1}
      - targets: ["b-2:28191"]
        labels: {region: region-b, node_id: b-2}
      - targets: ["b-3:28191"]
        labels: {region: region-b, node_id: b-3}
      - targets: ["a-4:28191"]
        labels: {region: region-a, node_id: a-4}
