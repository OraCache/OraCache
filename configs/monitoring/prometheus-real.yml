global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - raft-rules.yml

scrape_configs:
  - job_name: cp-api
    static_configs:
      - targets: ["cp-api:9464"]
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9466"]
  - job_name: storage-node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/storage-nodes.yml"]
        refresh_interval: 5s
