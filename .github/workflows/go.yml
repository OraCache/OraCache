name: Go
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
          cache-dependency-path: |
            go.sum
            gen/go.sum
            cmd/oracache/go.sum
            integration/e2e/go.sum
            Makefile
      - name: Check generated protobuf and gRPC code
        run: |
          make generate
          git diff --exit-code -- gen
          test -z "$(git ls-files --others --exclude-standard gen)"
      - name: Race tests with per-module JUnit
        id: tests
        run: make test
      - name: Vet modules
        run: make vet
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: .reports/*.xml
          include-hidden-files: true
          if-no-files-found: warn
      - name: Summarize test results
        if: always()
        env:
          REPORT_MODULES: gateway protobuf cli
          JOB_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          lines = ["## Test results", "",
                   f"Job status before reporting: **{os.environ['JOB_STATUS']}**; test step: **{os.environ['TEST_STATUS']}**.", "",
                   "| Module | Report | Tests | Passed | Failures | Errors | Skipped |",
                   "| --- | --- | ---: | ---: | ---: | ---: | ---: |"]
          details = []
          for module in os.environ["REPORT_MODULES"].split():
              path = Path(".reports") / f"{module}.xml"
              try:
                  tree = ET.parse(path)
                  suites = list(tree.getroot().iter("testsuite"))
                  if not suites:
                      raise ValueError("no test suites")
                  tests, failures, errors, skipped = [
                      sum(int(s.get(key, "0")) for s in suites)
                      for key in ("tests", "failures", "errors", "skipped")]
                  passed = tests - failures - errors - skipped
                  state = "FAIL" if failures or errors else "OK" if tests else "NO TEST CASES"
                  lines.append(f"| {module} | {state} | {tests} | {passed} | {failures} | {errors} | {skipped} |")
                  for case in tree.getroot().iter("testcase"):
                      for problem in list(case.findall("failure")) + list(case.findall("error")):
                          name = html.escape(f"{module}: {case.get('classname', '')}.{case.get('name', '')}")
                          text = html.escape((problem.get("message", "") + "\n" + (problem.text or "")).strip()[:8000])
                          details.append(f"<details><summary>{name}</summary><pre>{text}</pre></details>")
              except (OSError, ET.ParseError, ValueError) as exc:
                  lines.append(f"| {module} | NO RESULTS | — | — | — | — | — |")
                  details.append(f"{module}: no usable report ({html.escape(str(exc))}); tests may not have started or completed.")
          lines += ["", *details, "", "Counts describe reported test cases, not build/vet/generation success. See job logs for infrastructure or package build failures."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
  e2e:
    runs-on: ubuntu-latest
    env:
      ORACACHE_GATEWAY_IMAGE: oracache-gateway:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
          cache-dependency-path: |
            go.sum
            gen/go.sum
            cmd/oracache/go.sum
            integration/e2e/go.sum
            Makefile
      - uses: docker/setup-buildx-action@v3
      - name: Build current gateway with persistent layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.ORACACHE_GATEWAY_IMAGE }}
          cache-from: type=gha,scope=oracache-gateway
          cache-to: type=gha,scope=oracache-gateway,mode=max
      - name: Protobuf client against Compose gateway
        id: tests
        run: make test-e2e
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: .reports/*.xml
          include-hidden-files: true
          if-no-files-found: warn
      - name: Summarize test results
        if: always()
        env:
          REPORT_MODULES: e2e
          JOB_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          lines = ["## Test results", "",
                   f"Job status before reporting: **{os.environ['JOB_STATUS']}**; test step: **{os.environ['TEST_STATUS']}**.", "",
                   "| Module | Report | Tests | Passed | Failures | Errors | Skipped |",
                   "| --- | --- | ---: | ---: | ---: | ---: | ---: |"]
          details = []
          for module in os.environ["REPORT_MODULES"].split():
              path = Path(".reports") / f"{module}.xml"
              try:
                  tree = ET.parse(path)
                  suites = list(tree.getroot().iter("testsuite"))
                  if not suites:
                      raise ValueError("no test suites")
                  tests, failures, errors, skipped = [
                      sum(int(s.get(key, "0")) for s in suites)
                      for key in ("tests", "failures", "errors", "skipped")]
                  passed = tests - failures - errors - skipped
                  state = "FAIL" if failures or errors else "OK" if tests else "NO TEST CASES"
                  lines.append(f"| {module} | {state} | {tests} | {passed} | {failures} | {errors} | {skipped} |")
                  for case in tree.getroot().iter("testcase"):
                      for problem in list(case.findall("failure")) + list(case.findall("error")):
                          name = html.escape(f"{module}: {case.get('classname', '')}.{case.get('name', '')}")
                          text = html.escape((problem.get("message", "") + "\n" + (problem.text or "")).strip()[:8000])
                          details.append(f"<details><summary>{name}</summary><pre>{text}</pre></details>")
              except (OSError, ET.ParseError, ValueError) as exc:
                  lines.append(f"| {module} | NO RESULTS | — | — | — | — | — |")
                  details.append(f"{module}: no usable report ({html.escape(str(exc))}); tests may not have started or completed.")
          lines += ["", *details, "", "Counts describe reported test cases, not build/vet/generation success. See job logs for infrastructure or package build failures."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
