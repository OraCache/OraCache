name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Check generated protobuf and gRPC code
        run: |
          bash scripts/generate.sh
          git diff --exit-code -- gen
          test -z "$(git ls-files --others --exclude-standard gen)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Real CLI smoke test
        run: bash scripts/smoke.sh
