name: Go
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            gen/go.sum
            cmd/oracache/go.sum
            integration/e2e/go.sum
            Makefile
      - name: Check generated protobuf and gRPC code
        run: |
          make generate
          git diff --exit-code -- gen
          test -z "$(git ls-files --others --exclude-standard gen)"
      - name: Race tests with per-module JUnit
        id: tests
        run: make test
      - name: Vet modules
        run: make vet
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: .reports/*.xml
          include-hidden-files: true
          if-no-files-found: warn
      - name: Summarize test results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
        run: python3 tools/testreport.py --modules gateway protobuf cli --summary "$GITHUB_STEP_SUMMARY"
  e2e:
    runs-on: ubuntu-latest
    env:
      ORACACHE_GATEWAY_IMAGE: oracache-gateway:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            gen/go.sum
            cmd/oracache/go.sum
            integration/e2e/go.sum
            Makefile
      - uses: docker/setup-buildx-action@v3
      - name: Build current gateway with persistent layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.ORACACHE_GATEWAY_IMAGE }}
          cache-from: type=gha,scope=oracache-gateway
          cache-to: type=gha,scope=oracache-gateway,mode=max
      - name: Protobuf client against Compose gateway
        id: tests
        run: make test-e2e
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: .reports/*.xml
          include-hidden-files: true
          if-no-files-found: warn
      - name: Summarize test results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
        run: python3 tools/testreport.py --modules e2e --summary "$GITHUB_STEP_SUMMARY"
  report:
    name: Combined HTML test report
    needs: [test, e2e]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download available JUnit reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: .reports
          merge-multiple: true
      - name: Render offline HTML and summary
        env:
          UNIT_STATUS: ${{ needs.test.result }}
          E2E_STATUS: ${{ needs.e2e.result }}
        run: python3 tools/testreport.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload browsable report for this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: .reports/site/index.html
          include-hidden-files: true
          if-no-files-found: error
      - name: Prepare optional trusted Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .reports/site
  pages:
    name: Publish main test report
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: test-report-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static report
        id: deployment
        uses: actions/deploy-pages@v4
