name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Check generated protobuf and gRPC code
        run: |
          make generate
          git diff --exit-code -- gen
          test -z "$(git ls-files --others --exclude-standard gen)"
      - run: make test vet
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Protobuf client against Compose gateway
        run: make test-e2e
