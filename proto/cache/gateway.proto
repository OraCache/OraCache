// gateway.proto — интерфейс пользователя кеша.
//
// Пользователь (сервис профилей, CLI, тесты) знает ОДИН адрес и не видит,
// сколько регионов и нод за ним стоит. Gateway сам выбирает ближайший живой
// регион и ноду.
//
// Модель по последним требованиям заказчика (ответы тимлида от 29.10):
//   * Версию назначает КЕШ при Put. Пользователь передаёт только ключ и данные,
//     номер версии получает в ответе.
//   * У ключа хранится несколько последних версий (по умолчанию 3, лимит
//     настраивается). Более старые удаляются.
//   * «Инвалидация» = Put новой версии или Delete версии. Отдельного метода
//     Invalidate нет.
//   * TTL продлевается при Get — у всех версий ключа сразу. Есть потолок:
//     после него версия удаляется, даже если её читают.
//   * Put и Delete полностью реплицируются во второй регион.
//
// Пока требования не зафиксированы окончательно, открытые места помечены
// «УТОЧНИТЬ».

syntax = "proto3";

package gateway.v1;

option go_package = "github.com/OraCache/oracache/gen/gateway/v1;gatewayv1";

import "google/protobuf/timestamp.proto";

service CacheGateway {
  // Прочитать профиль: последнюю версию или конкретную.
  // При MISS пользователь сам читает источник и кладёт результат через Put
  // (cache-aside). Чтение продлевает TTL всех версий ключа (не дальше потолка).
  rpc Get(GetRequest) returns (GetResponse);

  // Записать новую версию. Номер версии назначает кеш и возвращает в ответе.
  // Новая версия становится последней; если версий больше лимита,
  // самая старая удаляется. Запись реплицируется во второй регион.
  rpc Put(PutRequest) returns (PutResponse);

  // Удалить версию (или все версии ключа). Реплицируется во второй регион.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // То же пачкой.
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);
  rpc BatchPut(BatchPutRequest) returns (BatchPutResponse);
}

// ============================================================
// Данные
// ============================================================

// Пол — enum из 3 значений (требование заказчика). Первое значение в proto3 всегда 0.
enum Sex {
  SEX_UNSPECIFIED = 0;
  SEX_MALE = 1;
  SEX_FEMALE = 2;
}

// Профиль из требований заказчика. Кеш его не разбирает: хранит
// сериализованные байты (поле data). Сообщение нужно клиентам, чтобы
// упаковать и распаковать профиль одинаково.
message Profile {
  string full_name = 1;                        // ФИО, до 100 символов UTF-8
  int32 age = 2;
  Sex sex = 3;
  google.protobuf.Timestamp registered_at = 4; // время регистрации
  string city = 5;                             // до 100 символов UTF-8
}

// ============================================================
// Get
// ============================================================

message GetRequest {
  string key = 1;               // "profile:<user_id>"

  // 0 = последняя версия. Иначе — конкретная версия (например, предыдущая).
  // УТОЧНИТЬ: когда пользователю нужна предыдущая версия — только по явному
  // запросу (как здесь) или кеш сам отдаёт её в каких-то случаях.
  uint64 rev = 2;

  RoutingHints hints = 3;
}

enum GetStatus {
  GET_STATUS_UNSPECIFIED = 0;
  GET_STATUS_HIT = 1;                // данные есть
  GET_STATUS_MISS = 2;               // ключа нет: идти в источник
  GET_STATUS_VERSION_NOT_FOUND = 3;  // ключ есть, но запрошенной версии нет
                                     // (вытеснена лимитом, удалена или истекла)
}

message GetResponse {
  GetStatus status = 1;
  uint64 rev = 2;               // какая версия отдана
  bytes data = 3;               // упакованный Profile, только при HIT
  uint64 latest_rev = 4;        // последняя версия ключа; rev < latest_rev = отдана не последняя

  // Срок жизни после этого чтения (TTL уже продлён) и потолок,
  // после которого версия удалится в любом случае.
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp hard_expires_at = 6;

  ServedBy served_by = 7;
}

// ============================================================
// Put
// ============================================================

message PutRequest {
  string key = 1;
  bytes data = 2;               // упакованный Profile, до 10 КБ

  // ПРЕДЛОЖЕНИЕ, УТОЧНИТЬ: условная запись для защиты от отката.
  // Раз версию назначает кеш, он не отличит свежие данные от опоздавших:
  // медленный клиент со старыми данными получит самый новый номер.
  // Решение — клиент указывает, от какой версии он отталкивался:
  //   не задано — записать без проверки;
  //   0         — записать, только если ключа ещё нет (заполнение после MISS);
  //   N         — записать, только если последняя версия сейчас равна N.
  optional uint64 expected_rev = 3;

  RoutingHints hints = 4;
}

enum PutStatus {
  PUT_STATUS_UNSPECIFIED = 0;
  PUT_STATUS_OK = 1;            // записано, rev — назначенный номер
  PUT_STATUS_CONFLICT = 2;      // expected_rev не совпал: кто-то записал раньше
  PUT_STATUS_TOO_LARGE = 3;     // data больше 10 КБ
}

message PutResponse {
  PutStatus status = 1;
  uint64 rev = 2;               // при OK — номер новой версии;
                                // при CONFLICT — текущая последняя версия
  ServedBy served_by = 3;

  // УТОЧНИТЬ: ответ приходит после записи в локальный регион, а во второй
  // регион запись уходит асинхронно. Нужна ли синхронная репликация?
  // УТОЧНИТЬ: как сделать номера версий уникальными между регионами
  // (иначе оба региона могут выдать свою «версию 5»).
}

// ============================================================
// Delete
// ============================================================

message DeleteRequest {
  string key = 1;

  // 0 = удалить все версии ключа. Иначе — одну версию.
  // УТОЧНИТЬ: нужно ли удаление одной версии или только всего ключа.
  uint64 rev = 2;

  RoutingHints hints = 3;
}

enum DeleteStatus {
  DELETE_STATUS_UNSPECIFIED = 0;
  DELETE_STATUS_DELETED = 1;
  DELETE_STATUS_NOT_FOUND = 2;  // такой версии или ключа нет — не ошибка, повтор безопасен
}

message DeleteResponse {
  DeleteStatus status = 1;
  ServedBy served_by = 2;
}

// ============================================================
// Batch
// ============================================================

message BatchGetRequest {
  repeated GetRequest items = 1;    // не больше 1000
}

message BatchGetResponse {
  repeated GetResponse items = 1;   // в том же порядке, что запрос
}

message BatchPutRequest {
  repeated PutRequest items = 1;    // не больше 1000
}

message BatchPutResponse {
  repeated PutResponse items = 1;   // статус по каждой записи; не «всё или ничего»
}

// ============================================================
// Маршрутизация и диагностика
// ============================================================

// Подсказки маршрутизации. Пользователь их обычно не задаёт;
// нужны для CLI и тестов.
message RoutingHints {
  string prefer_region = 1;     // пусто = ближайший живой регион
  bool local_only = 2;          // true = не уходить в другой регион при отказе
}

// Кто реально обслужил запрос — для диагностики и метрик.
message ServedBy {
  string region = 1;            // "region-a"
  string instance = 2;          // "cache-a-1"
  bool failover = 3;            // true = ответил не предпочтительный регион
}
