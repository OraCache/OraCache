name: oracache-replication

# E2E sets ORACACHE_REPLICATION_PORT=0 to let Docker allocate every published port.
x-app: &app
  image: ${ORACACHE_CP_IMAGE:-oracache-cp:local}
  pull_policy: never

x-a: &a
  <<: *app
  depends_on: [cp-api]
  entrypoint:
    - /storage-node
    - --cp-addr=cp-api:28081
    - --heartbeat-interval=1s
    - --grpc-listen=0.0.0.0:28091
    - --raft-listen=0.0.0.0:28191
    - --region=region-a
    - --group-id=region-a/shard-0/replication-1
    - --peer=1,a-1,a-1:28091,http://a-1:28191/raft
    - --peer=2,a-2,a-2:28091,http://a-2:28191/raft
    - --peer=3,a-3,a-3:28091,http://a-3:28191/raft
    - --replication-target-region=region-b

x-b: &b
  <<: *app
  depends_on: [cp-api]
  entrypoint:
    - /storage-node
    - --cp-addr=cp-api:28081
    - --heartbeat-interval=1s
    - --grpc-listen=0.0.0.0:28091
    - --raft-listen=0.0.0.0:28191
    - --region=region-b
    - --group-id=region-b/shard-0/replication-1
    - --peer=1,b-1,b-1:28091,http://b-1:28191/raft
    - --peer=2,b-2,b-2:28091,http://b-2:28191/raft
    - --peer=3,b-3,b-3:28091,http://b-3:28191/raft
    - --replication-source-region=region-a
    - --replication-source-group=region-a/shard-0/replication-1

services:
  cp-api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.cp
    command: [/cp-api, --config=/replication-config.json, --listen=0.0.0.0:28081, --metrics-listen=0.0.0.0:9464, --membership-state=/state/membership.json]
    volumes:
      - ./configs/cp-replication-compose.json:/replication-config.json:ro
      - cp-membership:/state
  api-gateway:
    <<: *app
    depends_on: [cp-api]
    command:
      - /api-gateway
      - --region=region-a
      - --node-id=gw-a
      - --cp-addr=cp-api:28081
      - --listen=0.0.0.0:28080
      - --status-listen=0.0.0.0:9466
      - --poll-interval=1s
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-38080}:28080", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-39466}:9466"]
  api-gateway-b:
    <<: *app
    depends_on: [cp-api]
    command: [/api-gateway, --region=region-b, --node-id=gw-b, --cp-addr=cp-api:28081, --listen=0.0.0.0:28080, --status-listen=0.0.0.0:9466, --poll-interval=1s]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-39080}:28080", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-39066}:9466"]
  a-1:
    <<: *a
    command: [--node-id=a-1, --peer-id=1]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-28091}:28091", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-28191}:28191"]
  a-2:
    <<: *a
    command: [--node-id=a-2, --peer-id=2]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-28092}:28091", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-28192}:28191"]
  a-3:
    <<: *a
    command: [--node-id=a-3, --peer-id=3]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-28093}:28091", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-28193}:28191"]
  a-4:
    <<: *a
    profiles: [learner]
    command: [--node-id=a-4, --peer-id=4, --join, "--peer=4,a-4,a-4:28091,http://a-4:28191/raft"]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-38194}:28191"]
  b-1:
    <<: *b
    command: [--node-id=b-1, --peer-id=1]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-29091}:28091", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-29191}:28191"]

  b-2:
    <<: *b
    command: [--node-id=b-2, --peer-id=2]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-29092}:28091", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-29192}:28191"]

  b-3:
    <<: *b
    command: [--node-id=b-3, --peer-id=3]
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-29093}:28091", "127.0.0.1:${ORACACHE_REPLICATION_PORT:-29193}:28191"]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-39090}:9090"]
    volumes:
      - ./configs/monitoring/prometheus-geo-demo.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/monitoring/raft-rules.yml:/etc/prometheus/raft-rules.yml:ro
  grafana:
    image: grafana/grafana:12.3.0
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oracache-mvp.json
    ports: ["127.0.0.1:${ORACACHE_REPLICATION_PORT:-33000}:3000"]
    volumes:
      - ./configs/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  cp-membership:
