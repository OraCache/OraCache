name: oracache-cp

x-image: &image
  image: ${ORACACHE_CP_IMAGE:-oracache-cp:local}
  build:
    context: .
    dockerfile: Dockerfile.cp

x-storage: &storage
  <<: *image
  depends_on: [cp-api]
  entrypoint:
    - /storage-node
    - --cp-addr=cp-api:28081
    - --heartbeat-interval=1s
    - --grpc-listen=0.0.0.0:28091
    - --raft-listen=0.0.0.0:28191
    - --peer=1,node-1,node-1:28091,http://node-1:28191/raft
    - --peer=2,node-2,node-2:28091,http://node-2:28191/raft
    - --peer=3,node-3,node-3:28091,http://node-3:28191/raft

services:
  cp-api:
    <<: *image
    command: [/cp-api, --config=/cp-config.json, --listen=0.0.0.0:28081, --metrics-listen=0.0.0.0:9464]
  node-1:
    <<: *storage
    command: [--node-id=node-1, --peer-id=1]
  node-2:
    <<: *storage
    command: [--node-id=node-2, --peer-id=2]
  node-3:
    <<: *storage
    command: [--node-id=node-3, --peer-id=3]
  api-gateway:
    <<: *image
    depends_on: [cp-api]
    command:
      - /api-gateway
      - --region=region-a
      - --node-id=gw-local
      - --cp-addr=${ORACACHE_GATEWAY_CP_ADDR:-cp-api:28081}
      - --listen=0.0.0.0:28080
      - --status-listen=0.0.0.0:9466
      - --poll-interval=1s
    ports:
      - "127.0.0.1:${ORACACHE_CP_PORT:-28080}:28080"
      - "127.0.0.1:${ORACACHE_CP_STATUS_PORT:-9466}:9466"
